<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Demoniceye Profile</title>

<style>
body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.card {
  width: 380px;
  background: #0d0d0d;
  border-radius: 16px;
  padding: 25px;
  text-align: center;
  box-shadow: 0 0 25px red;
  border: 1px solid #220000;
}

.avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 2px solid red;
}

h1 {
  margin: 10px 0 5px;
  color: red;
}

.bio {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 15px;
}

.status-box {
  background: #111;
  padding: 10px;
  border-radius: 10px;
  margin: 10px 0;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
}

.steam {
  background: #1b2838;
  color: white;
}

.discord {
  background: #5865F2;
  color: white;
}

a {
  text-decoration: none;
}
</style>
</head>

<body>

<div class="card">

  <!-- Discord Avatar (from Lanyard) -->
  <img id="avatar" class="avatar" src="" />

  <h1>Demoniceye</h1>

  <div class="bio">
    Watching from the shadows.
  </div>

  <!-- Discord Status / RPC -->
  <div class="status-box">
    Status: <span id="status">Loading...</span><br>
    Activity: <span id="activity">Loading...</span>
  </div>

  <!-- Steam -->
  <a href="https://steamcommunity.com/id/Demons-eye" target="_blank">
    <button class="steam">Steam Profile</button>
  </a>

  <!-- Discord -->
  <a href="https://discord.com/users/321059127172530178" target="_blank">
    <button class="discord">Open Discord Profile</button>
  </a>

</div>

<script>
// Discord ID
const DISCORD_ID = "321059127172530178";

// Lanyard API (Discord presence)
fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`)
  .then(res => res.json())
  .then(data => {

    const d = data.data;

    // Avatar
    document.getElementById("avatar").src =
      `https://cdn.discordapp.com/avatars/${DISCORD_ID}/${d.discord_user.avatar}.png`;

    // Status
    document.getElementById("status").innerText =
      d.discord_status;

    // Activity / RPC
    const activity = d.activities?.find(a => a.type === 0);

    document.getElementById("activity").innerText =
      activity ? activity.name : "Nothing";
  })
  .catch(() => {
    document.getElementById("status").innerText = "Offline";
    document.getElementById("activity").innerText = "Unavailable";
  });
</script>

</body>
</html>
