<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demoniceye</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #111;
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 20px red;
    }

    h1 {
      color: red;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background: black;
      color: white;
      border: 1px solid red;
      border-radius: 8px;
      padding: 10px;
      resize: none;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .steam {
      background: #1b2838;
      color: white;
    }

    .discord {
      background: #5865F2;
      color: white;
    }

    .copy {
      background: red;
      color: white;
    }

    img {
      width: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
      border: 2px solid red;
    }
  </style>
</head>

<body>

<div class="card">

  <!-- صورة الديسكورد -->
  <img src="https://i.imgur.com/placeholder.png" alt="Discord Avatar">

  <h1>Demoniceye</h1>

  <!-- بايو -->
  <textarea placeholder="Write your bio here..."></textarea>

  <!-- زر ستيم -->
  <button class="steam" onclick="window.open('https://steamcommunity.com/id/YOURID')">
    Steam Profile
  </button>

  <!-- زر ديسكورد -->
  <button class="discord" onclick="window.open('https://discord.com/users/YOURID')">
    Open Discord Profile
  </button>

  <!-- زر نسخ اليوزر -->
  <button class="copy" onclick="copyUser()">
    Copy Discord Username
  </button>

</div>

<script>
function copyUser() {
  navigator.clipboard.writeText("YOUR_DISCORD_USERNAME");
  alert("Copied Discord username!");
}
</script>

</body>
</html>
