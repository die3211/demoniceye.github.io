<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demoniceye Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0a0a0c;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            direction: ltr;
            overflow: hidden;
            position: relative;
        }

        /* حاوية الخلفية الثابتة بصيغة PNG مع تأثير البرق */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)), 
                        url('bg.png') no-repeat center center/cover;
            z-index: -2;
            animation: lightning 8s ease-in-out infinite;
        }

        @keyframes lightning {
            0%, 94%, 98%, 100% { filter: brightness(1); }
            95% { filter: brightness(1.4) contrast(1.1); }
            97% { filter: brightness(1.2); }
        }

        /* تأثير Mطر متحرك */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .drop {
            position: absolute;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.2));
            width: 1px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-120vh); }
            100% { transform: translateY(120vh); }
        }

        /* حاوية الكرت الأساسية مع الخطين المتحركين */
        .profile-card-wrapper {
            position: relative;
            width: 100%;
            max-width: 460px;
            border-radius: 24px;
            padding: 3px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .profile-card-wrapper::before {
            content: '';
            position: absolute;
            width: 160%;
            height: 160%;
            background: conic-gradient(
                transparent, #eb222a 10%, transparent 25%, 
                transparent, #eb222a 60%, transparent 75%
            );
            top: -30%;
            left: -30%;
            animation: rotateBorder 3.5s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* الكرت الداخلي بأسلوب الزجاج المضبّب */
        .profile-card {
            position: relative;
            background: rgba(12, 12, 15, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 40px 30px;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* حاوية صورة ليون PNG مع توهج أحمر */
        .avatar-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            position: relative;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(180deg, #eb222a, #220506);
            box-shadow: 0 0 25px rgba(235, 34, 42, 0.35);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #111;
        }

        /* الاسم والعبارة */
        .username {
            color: #eb222a;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(235, 34, 42, 0.3);
            text-align: center;
        }

        .tagline {
            color: #b3b3b3;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .tagline::before, .tagline::after {
            content: "•";
            color: #eb222a;
            font-size: 1.2rem;
        }

        /* خط الفاصل */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .divider .line {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, transparent, rgba(235, 34, 42, 0.4), transparent);
        }

        /* حجم ومظهر شعار الـ SVG الثابت */
        .umbrella-mini-logo {
            width: 34px;
            height: 34px;
            margin: 0 15px;
            filter: drop-shadow(0 0 5px rgba(235, 34, 42, 0.8));
        }

        .section-title {
            color: #eb222a;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        /* صندوق نبذة عني */
        .about-box {
            background: rgba(8, 8, 10, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 20px;
            text-align: left;
            margin-bottom: 25px;
        }

        .about-box p {
            color: #cccccc;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* شبكة الأزرار */
        .connect-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* تصميم الأزرار */
        .connect-button {
            background: rgba(8, 8, 10, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            text-align: left;
            cursor: pointer;
            transition: all 0.25s ease-in-out;
        }

        .connect-button:hover {
            background: rgba(235, 34, 42, 0.08);
            border-color: rgba(235, 34, 42, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(235, 34, 42, 0.1);
        }

        .connect-button i {
            font-size: 1.8rem;
            color: #ffffff;
            transition: transform 0.3s ease;
        }

        .connect-button:hover i { transform: scale(1.1); }

        .connect-info .platform-name {
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            display: block;
        }

        .connect-info .user-handle {
            color: #777777;
            font-size: 0.8rem;
            margin-top: 2px;
            display: block;
        }

        /* الحقوق */
        .footer-credits {
            color: #444444;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            text-align: center;
        }

        .footer-credits::before, .footer-credits::after {
            content: "";
            height: 1px;
            width: 40px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
        }
    </style>
</head>
<body>

    <audio id="rain-audio" loop>
        <source src="rain.wav" type="audio/wav">
    </audio>

    <div class="background-container"></div>
    <div class="rain-container" id="rain"></div>

    <div class="profile-card-wrapper">
        <div class="profile-card">
            
            <div class="avatar-container">
                <img src="leon.png" alt="Leon S. Kennedy">
            </div>

            <h1 class="username">Demoniceye</h1>
            <p class="tagline">Survival is just the beginning.</p>

            <div class="divider">
                <div class="line"></div>
                <svg class="umbrella-mini-logo" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="46" fill="#ffffff" />
                    
                    <path d="M50,50 L30,4 A46,46 0 0,1 70,4 Z" fill="#eb222a" /> <path d="M50,50 L70,96 A46,46 0 0,1 30,96 Z" fill="#eb222a" /> <path d="M50,50 L96,30 A46,46 0 0,1 96,70 Z" fill="#eb222a" /> <path d="M50,50 L4,70 A46,46 0 0,1 4,30 Z" fill="#eb222a" /> <circle cx="50" cy="50" r="46" fill="none" stroke="#111115" stroke-width="2" />
                    <line x1="50" y1="4" x2="50" y2="96" stroke="#111115" stroke-width="1.5" />
                    <line x1="4" y1="50" x2="96" y2="50" stroke="#111115" stroke-width="1.5" />
                </svg>
                <div class="line"></div>
            </div>

            <div class="section-title">
                <i class="fa-regular fa-user"></i> About Me
            </div>
            <div class="about-box">
                <p>Resident Evil fanatic. Games, darkness, and endless determination.</p>
            </div>

            <div class="section-title">
                <i class="fa-solid fa-link"></i> Connect
            </div>
            
            <div class="connect-grid">
                <a href="https://steamcommunity.com/id/demons-eye/" target="_blank" class="connect-button">
                    <i class="fa-brands fa-steam"></i>
                    <div class="connect-info">
                        <span class="platform-name">Steam</span>
                        <span class="user-handle">Demons-eye</span>
                    </div>
                </a>

                <a href="https://discord.com/users/321059127172530178" target="_blank" class="connect-button">
                    <i class="fa-brands fa-discord" style="color: #5865F2;"></i>
                    <div class="connect-info">
                        <span class="platform-name">Discord</span>
                        <span class="user-handle">View Profile</span>
                    </div>
                </a>
            </div>

            <div class="footer-credits">
                © 2026 Demoniceye
            </div>
        </div>
    </div>

    <script>
        const rainContainer = document.getElementById('rain');
        const maxDrops = 60;

        for (let i = 0; i < maxDrops; i++) {
            const drop = document.createElement('div');
            drop.classList.add('drop');
            drop.style.left = `${Math.random() * 100}vw`;
            drop.style.height = `${Math.random() * 20 + 15}px`;
            drop.style.animationDuration = `${Math.random() * 0.5 + 0.5}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            rainContainer.appendChild(drop);
        }

        const rainAudio = document.getElementById('rain-audio');
        rainAudio.volume = 0.4; 

        function startAudio() {
            rainAudio.play().catch(error => console.log("بانتظار التفاعل..."));
            document.removeEventListener('click', startAudio);
            document.removeEventListener('keydown', startAudio);
        }

        document.addEventListener('click', startAudio);
        document.addEventListener('keydown', startAudio);
    </script>
</body>
</html>
